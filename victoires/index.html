<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mes Victoires</title>

<style>
*{box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
margin:0;
background:#f4f4f6;
color:#111;
}

.wrap{
max-width:560px;
margin:auto;
padding:22px 16px 45px;
}

h1{
font-size:30px;
margin:8px 0 3px;
}

.sub{
color:#666;
margin:0;
}

.topbar{
display:flex;
gap:8px;
margin-top:14px;
}

.topbar button{
flex:1;
border:0;
border-radius:13px;
padding:11px;
font-weight:750;
}

.primary{
background:#111;
color:#fff;
}

.secondary{
background:#fff;
color:#111;
}

.daynav{
display:flex;
align-items:center;
justify-content:space-between;
background:#fff;
border-radius:18px;
padding:10px 12px;
margin-top:12px;
}

.daynav button{
border:0;
background:#eee;
border-radius:12px;
width:42px;
height:38px;
font-size:20px;
}

.daylabel{
text-align:center;
font-weight:800;
}

.daylabel small{
display:block;
color:#777;
font-size:12px;
font-weight:500;
margin-top:2px;
}

.hero{
background:#111;
color:#fff;
border-radius:22px;
padding:21px;
margin:14px 0;
}

.kicker{
font-size:12px;
color:#bbb;
}

.pct{
font-size:46px;
font-weight:850;
margin:4px 0;
}

.summary{
color:#bbb;
font-size:14px;
}

.scoreline{
display:flex;
justify-content:space-between;
align-items:center;
padding:9px 0;
border-top:1px solid #2d2d2d;
}

.scoreline b{
font-size:17px;
}

.minus{
border:0;
background:#2c2c2c;
color:#fff;
border-radius:9px;
width:34px;
height:30px;
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:#fff;
border-radius:20px;
padding:17px;
min-height:137px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.emoji{
font-size:32px;
}

.label{
font-weight:750;
margin-top:12px;
min-height:38px;
}

.buttons{
display:flex;
gap:7px;
margin-top:10px;
}

.win,.miss{
border:0;
border-radius:10px;
padding:9px 8px;
font-weight:750;
flex:1;
}

.win{
background:#111;
color:#fff;
}

.miss{
background:#eee;
color:#333;
}

.panel{
background:#fff;
border-radius:20px;
padding:15px;
margin-top:18px;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
padding:9px 0;
border-bottom:1px solid #eee;
}

.row:last-child{
border:0;
}

.small{
font-size:12px;
color:#777;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:flex-end;
justify-content:center;
z-index:20;
}

.modal.open{
display:flex;
}

.sheet{
background:#fff;
width:100%;
max-width:560px;
border-radius:24px 24px 0 0;
padding:20px 16px 28px;
max-height:82vh;
overflow:auto;
}

.sheet h3{
margin:0 0 5px;
}

.sheet p{
margin:0 0 14px;
color:#666;
}

.reasons{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.reason{
border:0;
background:#eee;
border-radius:13px;
padding:13px;
font-weight:700;
}

.cancel{
width:100%;
border:0;
background:#111;
color:#fff;
border-radius:13px;
padding:12px;
margin-top:10px;
font-weight:700;
}

.goalrow{
display:flex;
align-items:center;
gap:8px;
padding:11px 0;
border-bottom:1px solid #eee;
}

.goalname{
flex:1;
font-weight:700;
}

.toggle,.delete{
border:0;
border-radius:10px;
padding:8px 9px;
font-weight:700;
}

.toggle.on{
background:#111;
color:#fff;
}

.toggle.off,.delete{
background:#eee;
color:#555;
}

.form{
display:grid;
grid-template-columns:72px 1fr;
gap:9px;
margin-top:14px;
}

.form input{
border:1px solid #ddd;
border-radius:12px;
padding:12px;
font:inherit;
}

.add{
grid-column:1/-1;
border:0;
background:#111;
color:#fff;
border-radius:13px;
padding:12px;
font-weight:800;
}

.empty{
grid-column:1/-1;
background:#fff;
border-radius:18px;
padding:18px;
color:#666;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🏆 Mes Victoires</h1>
<p class="sub">Observer. Attendre. Choisir.</p>

<div class="topbar">
<button id="todayBtn" class="primary">Aujourd'hui</button>
<button id="goalsBtn" class="secondary">⚙️ Mes objectifs</button>
</div>

<div class="daynav">
<button id="prevDay">‹</button>
<div id="dayLabel" class="daylabel"></div>
<button id="nextDay">›</button>
</div>

<div class="hero">

<div class="kicker">
MAÎTRISE DU JOUR
</div>

<div class="pct" id="globalPct">
—
</div>

<div class="summary" id="summary">
Aucune occasion enregistrée
</div>

<div id="scores"></div>

</div>

<div class="grid" id="cards"></div>

<div class="panel">

<b>Détail du jour</b>

<div
id="history"
class="small"
style="margin-top:8px">
</div>

</div>

</div>


<div class="modal" id="missModal">

<div class="sheet">

<h3 id="missTitle">
Qu'est-ce qui s'est passé ?
</h3>

<p>
Un écart est une information, pas un jugement.
</p>

<div class="reasons" id="reasons"></div>

<button
class="cancel"
id="cancelMiss">
Annuler
</button>

</div>
</div>


<div class="modal" id="goalsModal">

<div class="sheet">

<h3>⚙️ Mes objectifs</h3>

<p>
Active, supprime ou crée tes propres objectifs.
</p>

<div id="goalList"></div>

<div class="form">

<input
id="newEmoji"
maxlength="4"
value="🎯">

<input
id="newName"
placeholder="Ex. Pas de téléphone au lit">

<button
class="add"
id="createGoalBtn">
Créer cet objectif
</button>

</div>

<button
class="cancel"
id="closeGoals">
Terminé
</button>

</div>
</div>


<script>

(function(){

"use strict";


const DEFAULT_GOALS = [

{
id:"tea",
icon:"☕",
name:"Thé",
label:"Thé sans biscuit",
active:true,
reasons:[
"Automatique",
"Envie forte",
"Faim",
"Choix conscient"
]
},

{
id:"alcohol",
icon:"🍷",
name:"Alcool",
label:"Verre évité / différé",
active:true,
reasons:[
"Automatique",
"Envie forte",
"Social",
"Choix conscient"
]
},

{
id:"sugar",
icon:"🍰",
name:"Sucre",
label:"Sucre évité",
active:true,
reasons:[
"Automatique",
"Envie forte",
"Faim",
"Choix conscient"
]
},

{
id:"emotion",
icon:"😤",
name:"Émotion",
label:"Prise de recul",
active:true,
reasons:[
"Trop rapide",
"Stress",
"Fatigue",
"Colère forte"
]
},

{
id:"sport",
icon:"💪",
name:"Sport",
label:"Sport fait",
active:true,
reasons:[
"Fatigue",
"Temps",
"Motivation",
"Choix conscient"
]
}

];


const DATA_KEY = "victoires_v10_data";

const GOAL_KEY = "victoires_v10_goals";

let selectedDate = new Date();

let pendingMissGoalId = null;


function el(id){

return document.getElementById(id);

}


function dateKey(d){

return d.getFullYear()
+"-"+
String(d.getMonth()+1).padStart(2,"0")
+"-"+
String(d.getDate()).padStart(2,"0");

}


function loadGoals(){

try{

const raw =
localStorage.getItem(GOAL_KEY);

if(raw === null){

localStorage.setItem(
GOAL_KEY,
JSON.stringify(DEFAULT_GOALS)
);

return DEFAULT_GOALS.map(
g => Object.assign({},g)
);

}

const parsed =
JSON.parse(raw);

if(Array.isArray(parsed)){
return parsed;
}

return DEFAULT_GOALS;

}

catch(e){

return DEFAULT_GOALS;

}

}


function saveGoals(goals){

localStorage.setItem(
GOAL_KEY,
JSON.stringify(goals)
);

}


function loadData(){

try{

return JSON.parse(
localStorage.getItem(DATA_KEY) || "{}"
);

}

catch(e){

return {};

}

}


function saveData(data){

localStorage.setItem(
DATA_KEY,
JSON.stringify(data)
);

}


function getGoal(id){

return loadGoals().find(
function(g){
return g.id === id;
}
);

}


function addEvent(goalId,result,reason){

const data =
loadData();

const k =
dateKey(selectedDate);

if(!data[k]){
data[k] = [];
}

data[k].push({

goalId:goalId,

result:result,

reason:reason || null,

time:new Date().toISOString()

});

saveData(data);

render();

}


function removeLast(goalId){

const data =
loadData();

const k =
dateKey(selectedDate);

const arr =
data[k] || [];

for(
let i=arr.length-1;
i>=0;
i--
){

if(arr[i].goalId === goalId){

arr.splice(i,1);

break;

}

}

data[k] = arr;

saveData(data);

render();

}


function percentage(wins,total){

if(!total){
return null;
}

return Math.round(
wins / total * 100
);

}


function openMiss(goalId){

const goal =
getGoal(goalId);

if(!goal){
return;
}

pendingMissGoalId =
goalId;

el("missTitle").textContent =
goal.icon+
" Qu'est-ce qui s'est passé ?";

el("reasons").innerHTML =
"";


const reasons =
goal.reasons || [

"Automatique",

"Envie forte",

"Contexte",

"Choix conscient"

];


reasons.forEach(
function(reason){

const button =
document.createElement("button");

button.className =
"reason";

button.textContent =
reason;


button.addEventListener(
"click",
function(){

addEvent(
pendingMissGoalId,
"miss",
reason
);

closeModal(
"missModal"
);

pendingMissGoalId =
null;

}
);


el("reasons")
.appendChild(button);

}
);


el("missModal")
.classList.add("open");

}


function closeModal(id){

el(id)
.classList.remove("open");

}


function renderGoalSettings(){

const goals =
loadGoals();

el("goalList").innerHTML =
"";


goals.forEach(
function(goal){

const row =
document.createElement("div");

row.className =
"goalrow";


const icon =
document.createElement("span");

icon.style.fontSize =
"24px";

icon.textContent =
goal.icon;


const name =
document.createElement("span");

name.className =
"goalname";

name.textContent =
goal.label;


const toggle =
document.createElement("button");

toggle.className =
"toggle "+
(goal.active ? "on":"off");

toggle.textContent =
goal.active ? "Actif":"Masqué";


toggle.addEventListener(
"click",
function(){

const all =
loadGoals();

const g =
all.find(
function(x){
return x.id === goal.id;
}
);

if(g){

g.active =
!g.active;

}

saveGoals(all);

renderGoalSettings();

render();

}
);


const del =
document.createElement("button");

del.className =
"delete";

del.textContent =
"Suppr.";


del.addEventListener(
"click",
function(){

const all =
loadGoals().filter(
function(x){
return x.id !== goal.id;
}
);

saveGoals(all);

renderGoalSettings();

render();

}
);


row.appendChild(icon);

row.appendChild(name);

row.appendChild(toggle);

row.appendChild(del);

el("goalList")
.appendChild(row);

}
);

}


function createGoal(){

const emoji =
(
el("newEmoji").value ||
"🎯"
).trim() || "🎯";


const name =
(
el("newName").value ||
""
).trim();


if(!name){
return;
}


const goals =
loadGoals();


goals.push({

id:"custom_"+Date.now(),

icon:emoji,

name:name,

label:name,

active:true,

reasons:[

"Automatique",

"Envie forte",

"Contexte",

"Choix conscient"

]

});


saveGoals(goals);


el("newName").value =
"";


renderGoalSettings();

render();

closeModal(
"goalsModal"
);

}


function render(){

const goals =
loadGoals();


const activeGoals =
goals.filter(
function(g){
return g.active;
}
);


const data =
loadData();


const k =
dateKey(selectedDate);


const events =
data[k] || [];


const today =
dateKey(new Date());


const dateText =
selectedDate.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);


el("dayLabel").innerHTML =

dateText+

"<small>"+

(
k === today
? "Aujourd'hui"
: "Journée enregistrée"
)

+"</small>";


const currentGoalIds =
goals.map(
function(g){
return g.id;
}
);


const visibleEvents =
events.filter(
function(event){

return currentGoalIds.indexOf(
event.goalId
) !== -1;

}
);


const wins =
visibleEvents.filter(
function(event){

return event.result === "win";

}
).length;


const total =
visibleEvents.length;


const globalPercentage =
percentage(
wins,
total
);


el("globalPct").textContent =

globalPercentage === null
? "—"
: globalPercentage+"%";


el("summary").textContent =

total

? wins+
" choix maîtrisés sur "+
total+
" occasions"

: "Aucune occasion enregistrée";


el("scores").innerHTML =
"";


goals.forEach(
function(goal){

const goalEvents =
events.filter(
function(event){

return event.goalId === goal.id;

}
);


if(!goalEvents.length){
return;
}


const goalWins =
goalEvents.filter(
function(event){

return event.result === "win";

}
).length;


const line =
document.createElement("div");

line.className =
"scoreline";


const text =
document.createElement("b");

text.textContent =

goal.icon+
" "+
goal.name+
" "+
goalWins+
"/"+
goalEvents.length+
" — "+
percentage(
goalWins,
goalEvents.length
)+
"%";


const minus =
document.createElement("button");

minus.className =
"minus";

minus.textContent =
"−";


minus.addEventListener(
"click",
function(){

removeLast(
goal.id
);

}
);


line.appendChild(text);

line.appendChild(minus);

el("scores")
.appendChild(line);

}
);


el("cards").innerHTML =
"";


if(!activeGoals.length){

const empty =
document.createElement("div");

empty.className =
"empty";

empty.textContent =
"Aucun objectif actif. Ouvre ⚙️ Mes objectifs pour en créer un.";

el("cards")
.appendChild(empty);

}

else{


activeGoals.forEach(
function(goal){

const card =
document.createElement("div");

card.className =
"card";


const emoji =
document.createElement("div");

emoji.className =
"emoji";

emoji.textContent =
goal.icon;


const label =
document.createElement("div");

label.className =
"label";

label.textContent =
goal.label;


const buttons =
document.createElement("div");

buttons.className =
"buttons";


const win =
document.createElement("button");

win.className =
"win";

win.textContent =
"✓ Maîtrisé";


win.addEventListener(
"click",
function(){

addEvent(
goal.id,
"win",
null
);

}
);


const miss =
document.createElement("button");

miss.className =
"miss";

miss.textContent =
"○ Écart";


miss.addEventListener(
"click",
function(){

openMiss(
goal.id
);

}
);


buttons.appendChild(win);

buttons.appendChild(miss);


card.appendChild(emoji);

card.appendChild(label);

card.appendChild(buttons);


el("cards")
.appendChild(card);

}
);

}


el("history").innerHTML =
"";


if(!events.length){

el("history").textContent =
"Aucune occasion enregistrée.";

}

else{


events
.slice()
.reverse()
.forEach(
function(event){

const goal =
goals.find(
function(g){

return g.id ===
event.goalId;

}
);


if(!goal){
return;
}


const row =
document.createElement("div");

row.className =
"row";


const left =
document.createElement("span");


left.textContent =

goal.icon+
" "+
(
event.result === "win"
? "✓ Maîtrisé"
: "○ Écart"
)
+
(
event.reason
? " · "+event.reason
: ""
);


const right =
document.createElement("span");


right.textContent =

new Date(
event.time
)
.toLocaleTimeString(
"fr-FR",
{
hour:"2-digit",
minute:"2-digit"
}
);


row.appendChild(left);

row.appendChild(right);


el("history")
.appendChild(row);

}
);

}

}


el("todayBtn")
.addEventListener(
"click",
function(){

selectedDate =
new Date();

render();

}
);


el("prevDay")
.addEventListener(
"click",
function(){

selectedDate.setDate(
selectedDate.getDate()-1
);

render();

}
);


el("nextDay")
.addEventListener(
"click",
function(){

selectedDate.setDate(
selectedDate.getDate()+1
);

render();

}
);


el("goalsBtn")
.addEventListener(
"click",
function(){

renderGoalSettings();

el("goalsModal")
.classList.add("open");

}
);


el("closeGoals")
.addEventListener(
"click",
function(){

closeModal(
"goalsModal"
);

}
);


el("cancelMiss")
.addEventListener(
"click",
function(){

closeModal(
"missModal"
);

}
);


el("createGoalBtn")
.addEventListener(
"click",
createGoal
);


render();


})();

</script>

</body>
</html>
